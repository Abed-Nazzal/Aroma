<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aroma</title>
<meta name="theme-color" content="#f6f6f1">
<style>
:root{--bg:#f6f6f1;--ink:#3b2a22;--green:#7f9a5a;--clay:#c9783f;}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.logo{width:min(78%,300px);height:auto;mix-blend-mode:multiply;display:block}
p.lead{font-size:1.05rem;margin:4px 0 26px;opacity:.8}
nav{width:100%;display:flex;flex-direction:column;gap:14px}
a.link{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:16px;background:#fff8;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-size:1.15rem;font-weight:600;transition:background .15s,color .15s,transform .15s}
a.link svg{width:28px;height:28px;flex:none}
a.link:hover,a.link:focus-visible{background:var(--ink);color:var(--bg)}
a.link:active{transform:scale(.98)}
a.link:focus-visible{outline:3px solid var(--clay);outline-offset:3px}
a.wa svg{color:var(--green)} a.ig svg{color:var(--clay)} a.tt svg{color:var(--ink)}
a.link:hover svg,a.link:focus-visible svg{color:var(--bg)}
@media (prefers-reduced-motion:reduce){a.link{transition:none}}
</style>
</head>
